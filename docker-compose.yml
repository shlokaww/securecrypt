services:
  securecrypt:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
