{% extends 'base.html' %}{% block title %}Decrypt · SecureCrypt{% endblock %}{% block content %}<h1 class="mb-4">Decrypt</h1><div class="alert alert-warning" role="note">Text, passwords, and files are processed on the SecureCrypt server. Don’t submit sensitive material unless you trust the service operator.</div><div class="row g-4"><section class="col-lg-6"><div class="card p-4 h-100"><h2>Text</h2><form data-api="/api/decrypt-text" data-mode="text-decrypt"><label class="form-label" for="payload">Encrypted payload</label><textarea class="form-control mb-3" id="payload" name="payload" required></textarea><label class="form-label" for="dec-text-pass">Password</label><div class="input-group mb-3"><input class="form-control" id="dec-text-pass" name="password" type="password" maxlength="1024" required><button class="btn btn-outline-light" type="button" data-password-toggle="dec-text-pass">Show</button></div><button class="btn btn-primary" type="submit">Decrypt text <span class="spinner-border spinner-border-sm d-none"></span></button></form><pre class="result-text d-none mt-3"></pre></div></section><section class="col-lg-6"><div class="card p-4 h-100"><h2>File</h2><form data-api="/api/decrypt-file" data-mode="file"><label class="dropzone mb-3" for="dec-file">Drop an .enc file here or choose one<input class="form-control mt-2" id="dec-file" name="file" type="file" accept=".enc,application/octet-stream" required></label><label class="form-label" for="dec-file-pass">Password</label><div class="input-group mb-3"><input class="form-control" id="dec-file-pass" name="password" type="password" maxlength="1024" required><button class="btn btn-outline-light" type="button" data-password-toggle="dec-file-pass">Show</button></div><button class="btn btn-primary" type="submit">Decrypt file <span class="spinner-border spinner-border-sm d-none"></span></button></form><a class="btn btn-success d-none mt-3" data-download>Download decrypted file</a></div></section></div>{% endblock %}
